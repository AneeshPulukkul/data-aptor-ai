version: '3.8'

services:
  # Client Layer
  web-ui:
    build:
      context: ./client
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - api-gateway

  # Application Layer
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway:/app
    environment:
      - PYTHONPATH=/app
      - AUTH_SERVICE_URL=http://auth-service:8080
      - ORCHESTRATION_SERVICE_URL=http://orchestration-service:8001
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      auth-service:
        condition: service_started
      orchestration-service:
        condition: service_healthy

  auth-service:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD:-changeme}
    volumes:
      - ./auth-service/config:/opt/keycloak/data/import
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  orchestration-service:
    build:
      context: ./orchestration-service
    ports:
      - "8001:8001"
    volumes:
      - ./orchestration-service:/app
    environment:
      - PYTHONPATH=/app
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8003
      - SCORING_SERVICE_URL=http://scoring-service:8004
      - REPORTING_SERVICE_URL=http://reporting-service:8005
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      ingestion-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      scoring-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy

  # Processing Layer
  ingestion-service:
    build:
      context: ./processing/ingestion-service
    ports:
      - "8002:8002"
    volumes:
      - ./processing/ingestion-service:/app
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=dataaptor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET=temp-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  assessment-service:
    build:
      context: ./processing/assessment-service
    ports:
      - "8003:8003"
    volumes:
      - ./processing/assessment-service:/app
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=dataaptor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET=temp-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  scoring-service:
    build:
      context: ./processing/scoring-service
    ports:
      - "8004:8004"
    volumes:
      - ./processing/scoring-service:/app
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=dataaptor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  reporting-service:
    build:
      context: ./processing/reporting-service
    ports:
      - "8005:8005"
    volumes:
      - ./processing/reporting-service:/app
    environment:
      - PYTHONPATH=/app
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=dataaptor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
      - S3_BUCKET=report-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # Data Storage Layer
  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dataaptor}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/metadata-db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dataaptor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme123}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  minio_data:
